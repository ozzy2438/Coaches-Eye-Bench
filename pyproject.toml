[project]
name = "coaches-eye-bench"
version = "0.1.0"
description = "Open, reproducible benchmark: how much of AFL coaches' match votes can a transparent model built from public box scores reproduce?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "lightgbm>=4.3",
  "duckdb>=1.0",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "tabulate>=0.10.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ceb = "ceb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: planted-effect recovery tests on larger synthetic data"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E702", "E731", "E741"]
